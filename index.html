    <link rel="stylesheet" href="style.css" />
  <style>
    .gallery-header .logo {
      display: grid;
      grid-template-columns: 1.85rem auto;
      grid-template-rows: auto auto;
      align-items: center;
      column-gap: 0.38rem;
      row-gap: 0;
    }

    .gallery-header .logo::before {
      content: "";
      grid-column: 1;
      grid-row: 1 / span 2;
      display: block;
      width: 1.85rem;
      aspect-ratio: 1;
      background: url("assets/plutchik-smutek.png") center / contain no-repeat;
    }

    .gallery-header .logo > span {
      grid-column: 2;
      grid-row: 1;
    }

    .gallery-header .logo > em {
      grid-column: 2;
      grid-row: 2;
    }

    @media (max-width: 680px) {
      .gallery-header .logo {
        grid-template-columns: 1.55rem auto;
        column-gap: 0.3rem;
      }

      .gallery-header .logo::before {
        width: 1.55rem;
      }
    }
  </style>
  <link rel="stylesheet" href="final-overrides.css">
  <script defer src="final-overrides.js"></script>

</head>
  <body class="gallery-page" data-title-pl="chmury emocji — start" data-title-en="emotional clouds — start">
    <header class="gallery-header"><a class="logo" href="index.html">chmury<br /><em>emocji</em></a><nav><a class="active" href="index.html" data-i18n="nav-start">start</a><a href="o-projekcie.html" data-i18n="nav-about">o projekcie</a><a href="proces.html" data-i18n="nav-process">proces</a><a href="o-mnie.html" data-i18n="nav-me">o mnie</a></nav><div class="language-switch" aria-label="Wybór języka"><button type="button" data-lang="pl">PL</button><span>/</span><button type="button" data-lang="en">EN</button></div></header>
    <main class="gallery-main">
      <section class="viewport" id="viewport" aria-label="Interaktywna plansza instalacji">
        <div class="canvas" id="canvas">
          <div class="canvas-line vertical"></div><div class="canvas-line horizontal"></div>
          <button class="work w01" data-work="1" style="--x:650px;--y:430px;--w:168px;--h:238px"><img src="public/assets/works/01.png" alt="Grafika 1" /><span>01</span></button>
          <button class="work w02" data-work="2" style="--x:875px;--y:480px;--w:200px;--h:280px"><img src="public/assets/works/02.png" alt="Grafika 2" /><span>02</span></button>
          <button class="work w03" data-work="3" style="--x:1140px;--y:550px;--w:180px;--h:260px"><img src="public/assets/works/03.png" alt="Grafika 3" /><span>03</span></button>
          <button class="work w04" data-work="4" style="--x:1380px;--y:370px;--w:119px;--h:168px"><img src="public/assets/works/04.png" alt="Grafika 4" /><span>04</span></button>
          <button class="work w05" data-work="5" style="--x:1510px;--y:590px;--w:119px;--h:168px"><img src="public/assets/works/05.png" alt="Grafika 5" /><span>05</span></button>
        </div>
      </section>
    </main>
    <dialog class="work-modal" id="workModal"><button class="modal-close" aria-label="Zamknij" data-i18n-aria="close">×</button><div class="modal-work"><img id="modalImage" src="" alt="" /><div class="modal-pager"><button id="previousWork" aria-label="Poprzednia praca">‹</button><span id="pageDots"></span><button id="nextWork" aria-label="Następna praca">›</button></div></div><div class="modal-info"><p id="modalNumber" class="mono">grafika 01 / 18</p><h1 id="modalTitle" data-i18n="modal-artwork">Grafika</h1><div class="modal-description"><p id="modalText" data-i18n="modal-text">Opis pracy do uzupełnienia.</p><p id="modalDetails" data-i18n="modal-details"></p></div><p class="modal-technique" id="modalTechnique" data-i18n="modal-technique"></p></div></dialog>
    <script src="language.js"></script>
    <script src="script.js"></script>
  <style>
    /* Stały, widoczny od razu układ pięciu prac na tablicy — sprawdzony. */
    #canvas {
      position: relative !important;
      transform: none !important;
      width: 100% !important;
      height: calc(100vh - 5.4rem) !important;
      min-height: 42rem;
      overflow: hidden !important;
      touch-action: auto !important;
    }

    #canvas .work {
      position: absolute !important;
      display: block !important;
      max-width: none !important;
      transform: none !important;
      pointer-events: auto !important;
      cursor: pointer !important;
      z-index: 2;
    }

    #canvas .work img {
      pointer-events: none;
    }

    #canvas .w01 { left: 6% !important; top: 18% !important; width: clamp(9.5rem, 15vw, 13.5rem) !important; }
    #canvas .w02 { left: 27% !important; top: 27% !important; width: clamp(10rem, 16vw, 14rem) !important; }
    #canvas .w03 { left: 48% !important; top: 42% !important; width: clamp(8rem, 12vw, 11rem) !important; }
    #canvas .w04 { left: 66% !important; top: 14% !important; width: clamp(9rem, 14vw, 12.5rem) !important; }
    #canvas .w05 { left: 82% !important; top: 39% !important; width: clamp(8rem, 11vw, 10rem) !important; }

    @media (max-width: 800px) {
      #canvas {
        height: calc(100vh - 4.6rem) !important;
        min-height: 35rem;
      }

      #canvas .w01 { left: 6% !important; top: 13% !important; width: 24% !important; }
      #canvas .w02 { left: 38% !important; top: 12% !important; width: 24% !important; }
      #canvas .w03 { left: 70% !important; top: 16% !important; width: 20% !important; }
      #canvas .w04 { left: 18% !important; top: 53% !important; width: 22% !important; }
      #canvas .w05 { left: 58% !important; top: 52% !important; width: 23% !important; }
    }
  </style>

  <script>
    (() => {
      const applyThirdWorkDescription = () => {
        const language = new URLSearchParams(window.location.search).get('lang') === 'en' ? 'en' : 'pl';
        const copy = language === 'en'
          ? {
              text: 'An attempt to escape a difficult emotional state, alongside a lack of belief in one’s own agency.',
              details: '',
              technique: 'Technique: digital graphics, print on Plexiglas.'
            }
          : {
              text: 'Próba ucieczki z trudnego stanu emocjonalnego, jednoczesny brak wiary we własną sprawczość.',
              details: '',
              technique: 'Technika: grafika cyfrowa, druk na pleksi.'
            };

        const text = document.getElementById('modalText');
        const details = document.getElementById('modalDetails');
        const technique = document.getElementById('modalTechnique');
        if (text) text.textContent = copy.text;
        if (details) details.textContent = copy.details;
        if (technique) technique.textContent = copy.technique;
      };

      const thirdWork = document.querySelector('#canvas .work.w03');
      if (thirdWork) {
        thirdWork.addEventListener('click', () => window.setTimeout(applyThirdWorkDescription, 0));
      }
    })();
  </script>
  <script src="site-overrides.js"></script>

  <script src="gallery-reset.js"></script>
  <script src="ui-fixes.js"></script>

</body>
</html>
